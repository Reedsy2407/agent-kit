# Ejemplo de integración continua del esqueleto Python. No se ejecuta dentro del kit: se copia con el esqueleto.
# Solo lectura: prueba y analiza, no publica. Versiones de acciones consultadas el 2026-10-29; compruébalas al usarlas.
# Se prueban la versión mínima declarada en pyproject.toml y una actual.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  probar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Herramientas de desarrollo (versiones fijadas)
        run: python -m pip install ruff==0.17.3 pip-audit==2.10.1
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests -t . -v
      - name: Vulnerabilidades conocidas en las dependencias del proyecto
        run: pip-audit .
