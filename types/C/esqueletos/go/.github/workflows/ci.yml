# Ejemplo de integración continua del esqueleto Go. No se ejecuta dentro del kit: se copia con el esqueleto.
# Solo lectura: prueba y analiza, no publica. Versiones de acciones consultadas el 2026-10-29; compruébalas al usarlas.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  probar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: false
      - name: Formato (falla si gofmt encuentra diferencias)
        shell: bash
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Vulnerabilidades conocidas (govulncheck fijado)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
